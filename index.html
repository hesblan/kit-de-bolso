<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f0c"><title>Kit de Bolso do Técnico</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icone.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icone-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kit de Bolso">
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-monospace,monospace;background:#0b0f0c;color:#b6f5c8;padding:0 8px 24px}
header{position:sticky;top:0;background:#0b0f0c;padding:8px 0 6px;z-index:5;border-bottom:1px solid #1f3a27}
h1{font-size:15px;color:#5dff8f;margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#st{font-size:10px;color:#7a9c85}#redeAt{font-size:10px;color:#7a9c85;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:4px;overflow-x:auto}nav button{flex:none}nav button.on{background:#2e7a47;color:#fff}
.c{border:1px solid #1f3a27;border-radius:10px;padding:9px;margin:9px 0;background:#0f1712}
.c h2{font-size:13px;margin:0 0 3px;color:#7dffa6}.c p{font-size:11px;color:#7a9c85;margin:0 0 6px}
button{background:#163d24;color:#c9ffd9;border:1px solid #2e7a47;border-radius:6px;padding:7px 9px;font:inherit;font-size:12px;margin:2px 3px 3px 0;cursor:pointer}
button.r{background:#4a1616;border-color:#a33}button.y{background:#4a3f16;border-color:#aa3}button:disabled{opacity:.5}
#instalar,#ajudaB{font-size:10px;padding:4px 7px;margin:0}#ajudaB{background:#2e7a47;color:#fff}
#tut{position:fixed;left:6px;right:6px;bottom:6px;max-height:75vh;overflow:auto;background:#0f1712;border:2px solid #5dff8f;border-radius:12px;padding:10px;z-index:8;box-shadow:0 0 30px #000}#tut h2{font-size:14px;color:#7dffa6;margin:6px 0}#tut p{font-size:12.5px;line-height:1.45}#tut .tb button.on{background:#2e7a47;color:#fff}details summary{cursor:pointer;color:#c9ffd9}
input,select{background:#050806;color:#c9ffd9;border:1px solid #2e7a47;border-radius:6px;padding:7px;font:inherit;font-size:12px;width:100%;margin-bottom:5px}
pre{white-space:pre-wrap;word-break:break-all;font-size:10.5px;background:#050806;padding:6px;border-radius:6px;max-height:300px;overflow:auto;margin:4px 0 0;min-height:12px}
table{width:100%;border-collapse:collapse;font-size:10px}td,th{padding:3px 4px;border-bottom:1px solid #15261b;text-align:left;vertical-align:top}th{color:#7dffa6;position:sticky;top:0;background:#0f1712}
.tw{max-height:420px;overflow:auto}.bar{height:6px;background:#2e7a47;border-radius:3px;margin:1px 0 4px}.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.k{background:#050806;border-radius:6px;padding:6px;text-align:center;overflow:hidden}.k b{display:block;font-size:17px;color:#5dff8f;word-break:break-all}.k span{font-size:9px;color:#7a9c85}
#full{position:fixed;inset:0;display:none;z-index:9}canvas{width:100%;height:90px;background:#050806;border-radius:6px}
tr.TLS td,tr.HTTPS td{color:#9fd7ff}tr.DNS td{color:#ffe08a}tr.HTTP td{color:#ff9f9f}
.al{font-size:11px;padding:5px 7px;border-radius:6px;margin:3px 0;border-left:3px solid}
.alto{background:#2a0e0e;border-color:#f44}.medio{background:#2a230e;border-color:#fb3}.baixo{background:#0e2a18;border-color:#3f6}
.aviso{font-size:11px;color:#ffd27a;background:#2a230e;border:1px solid #6b5a1f;border-radius:8px;padding:7px;margin:8px 0}
a.bt{display:inline-block;background:#163d24;color:#c9ffd9;border:1px solid #2e7a47;border-radius:6px;padding:8px 10px;font-size:12px;margin:5px 4px 0 0;text-decoration:none}
#off{font-size:11px;color:#ffd27a;background:#2a0e0e;border:1px solid #a33;border-radius:8px;padding:7px;margin:4px 0}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3f6;margin-right:4px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.3}}
@media print{header,nav,.c:not(#rel){display:none}#rel{border:0}}
</style></head><body>
<header><h1><span>▓ Kit de Bolso</span><span><button id="ajudaB" data-f="ajuda" data-a="[&quot;passos&quot;]">❓ Ajuda</button> <button id="instalar" data-f="instalar" hidden>⬇ Instalar app</button> <span id="st">conectando…</span></span></h1><div id="redeAt"></div><div id="off" hidden>⚠ O servidor do Kit parou. <a class="bt" href="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.termux;component=com.termux/.app.TermuxActivity;end">▶ Abrir o Termux</a> <a class="bt" href="/">Tentar de novo</a></div><nav id="nav"></nav></header>
<main id="main"></main><div id="full"></div><div id="tut" hidden></div>
<script>
const TOKEN=/*KIT_TOKEN*/"";
// Sem token injetado = página aberta fora do servidor (arquivo ou outro site):
// só as ferramentas que rodam no próprio navegador funcionam.
const SERVIDOR=!!TOKEN,SEM_SRV='Requer o servidor do Kit rodando no Termux (comando: kit).';
const $=s=>document.querySelector(s);
// --- escape de HTML: usar em TODO valor dinâmico vindo da rede/captura
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H={'X-Kit-Token':TOKEN};
async function apiGET(p,a){if(!SERVIDOR)return{erro:SEM_SRV};const u=p+(a!==undefined&&a!==''?(p.includes('?')?'&':'?')+'a='+encodeURIComponent(a):'');const r=await fetch(u,{headers:H});return r.json()}
async function apiPOST(p,body){if(!SERVIDOR)return{erro:SEM_SRV};const r=await fetch(p,{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body||{})});return r.json()}
const v=id=>($('#'+id)?.value||'').trim(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const out=(id,t)=>{const p=$('#o'+id);if(p)p.textContent=typeof t=='string'?t:JSON.stringify(t,null,1)};
const add=(id,t)=>{const p=$('#o'+id);if(p)p.textContent=(typeof t=='string'?t:JSON.stringify(t,null,1))+'\n'+p.textContent};
const fmtB=b=>b>1e6?(b/1e6).toFixed(1)+' MB':b>1e3?(b/1e3).toFixed(0)+' KB':b+' B';
const hora=t=>new Date(t*1000).toLocaleTimeString();
const dataH=t=>t?new Date(t*1000).toLocaleString():'-';
const qsRede=()=>REDE_SEL?'rede='+encodeURIComponent(REDE_SEL):'';
let INFO={},REDES={atual:null,redes:[]},REDE_SEL=null;
// stream de /api/run (POST), tratando content-type nulo e status de erro (401 etc.)
async function stream(id,tool,arg){const p=$('#o'+id);if(!p)return;if(!SERVIDOR){p.textContent=SEM_SRV;return}p.textContent='…';
  let r;try{r=await fetch('/api/run',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({t:tool,a:arg})});}catch(e){p.textContent='falha de conexão: '+e.message;return}
  const ct=r.headers.get('content-type')||'';
  if(!r.ok){let msg='erro HTTP '+r.status;try{if(ct.includes('json'))msg=(await r.json()).erro||msg;}catch{}p.textContent=msg;return}
  if(ct.includes('json')){p.textContent=(await r.json()).erro||'';return}
  p.textContent='';const rd=r.body.getReader(),dc=new TextDecoder();for(;;){const{done,value}=await rd.read();if(done)break;p.textContent+=dc.decode(value,{stream:true});p.scrollTop=1e9}}
const inp=(id,ph,val='')=>`<input id="${id}" placeholder="${esc(ph)}" value="${esc(val)}">`;
const card=(id,t,d,body)=>`<div class="c"><h2>${t}</h2><p>${d}</p>${body}<pre id="o${id}"></pre></div>`;
// Botões sem handler inline: data-f é o nome da ação em ACOES e data-a seus argumentos (JSON).
const btn=(t,f,cls='',...args)=>`<button class="${cls}" data-f="${f}" data-a="${esc(JSON.stringify(args))}">${t}</button>`;
const redeSel=()=>`<select class="redeSel" data-chg="redeEscolher"></select>`;
function chart(id,arr,max){const c=$('#'+id);if(!c)return;const g=c.getContext('2d');c.width=c.clientWidth;c.height=90;g.clearRect(0,0,c.width,90);g.strokeStyle='#5dff8f';g.lineWidth=1.5;g.beginPath();const m=max||Math.max(...arr,1);arr.forEach((y,i)=>{const X=i*c.width/Math.max(arr.length-1,1),Y=88-y/m*84;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()}
function bars(el,arr,f=x=>x){const m=Math.max(...arr.map(x=>x[1]),1);const e=typeof el=='string'?$(el):el;if(e)e.innerHTML=arr.length?arr.map(([k,n])=>`<div style="font-size:11px">${esc(k)} <span style="color:#7a9c85">${esc(f(n))}</span></div><div class="bar" style="width:${Math.max(n/m*100,2)}%"></div>`).join(''):'<p>Sem dados ainda.</p>'}

// Abre o app Termux (intent do Android). Mesmo texto de INTENT_TERMUX no server.py.
const INTENT_TERMUX="intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.termux;component=com.termux/.app.TermuxActivity;end";
const AVISO_NAV=SERVIDOR?'':`<div class="aviso"><b>Modo navegador:</b> esta página foi aberta sem o servidor do Kit. Aqui já funcionam os testes de hardware, sensores, câmera, GPS, NFC, Bluetooth, velocidade e sub-rede. Rede, captura e inventário precisam do servidor.<br><br><b>Para ter tudo:</b> 1) abra o Termux; 2) digite <b>kit</b> e toque em Enter. O Kit liga e abre sozinho, já completo. Com o modo automático (já vem ligado pelo instalador), só abrir o Termux basta.<br><a class="bt" href="${INTENT_TERMUX}">▶ Abrir o Termux</a> <a class="bt" href="http://127.0.0.1:8080/abrir">Já liguei: abrir o Kit completo</a><div id="sonda"></div></div>`;
// No modo navegador, procura o servidor em 127.0.0.1:8080 e avisa quando ele aparece.
function sondar(){if(SERVIDOR)return;fetch('http://127.0.0.1:8080/manifest.webmanifest',{mode:'no-cors',cache:'no-store'}).then(()=>{const e=$('#sonda');if(e)e.innerHTML='<p style="color:#5dff8f;margin:6px 0 0">✔ O servidor do Kit está ligado. Toque em <b>Já liguei: abrir o Kit completo</b>.</p>';$('#st').textContent='servidor encontrado'}).catch(()=>setTimeout(sondar,4000))}
function offline(sim){const e=$('#off');if(e)e.hidden=!sim;if(sim)$('#st').textContent='servidor offline'}
const ABAS={
Painel:()=>`${AVISO_NAV}
<div class="c"><h2><span class="led"></span>Painel geral</h2><p>Visão consolidada da rede e da captura. Atualiza sozinho. Opera só sobre a <b>sua</b> rede e os <b>seus</b> aparelhos.</p><div class="g3" id="kpi"></div></div>
<div class="c"><h2>Tráfego ao vivo</h2><canvas id="trf"></canvas><p id="trfL" style="margin:4px 0 0"></p></div>
<div class="g"><div class="c"><h2>Protocolos</h2><div id="pPrt"></div></div><div class="c"><h2>Top domínios</h2><div id="pDom"></div></div></div>
<div class="c"><h2>⚠ Tráfego inseguro</h2><p>Conexões sem criptografia (Telnet, FTP, HTTP, POP3).</p><div id="pIns"></div></div>
<div class="c"><h2>Últimos alertas desta rede</h2><div id="pAl"></div></div>
<div class="c"><h2>Atalhos</h2>${btn('🔍 Varrer rede','ir','','Segurança','invScan')}${btn('🛡 Detecções','ir','','Segurança','detLoad')}${btn('📄 Relatório','ir','','Relatório','relatorio')}${btn('⬇ JSON','baixarJSON')}${btn('⬇ .pcap','baixarPcap')}</div>`,
Captura:()=>`${AVISO_NAV}
<div class="c"><h2>Captura de pacotes (estilo Wireshark)</h2>
<p>1) Instale <b>PCAPdroid</b>. 2) Ajustes → Modo de despejo: <b>Exportador UDP</b>, IP <b>127.0.0.1</b>, porta <b>5123</b>, formato <b>PCAP</b>. 3) Iniciar no PCAPdroid. Captura o tráfego <u>deste celular</u>, por app, sem root. Deauth, ARP e DHCP de outros aparelhos só aparecem em .pcap importado.</p>
${btn('▶ Ao vivo','capLive','',1)}${btn('⏸ Pausar','capLive','',0)}${btn('⬇ .pcap (Wireshark)','baixarPcap')}${btn('Limpar','capLimpar','r')}</div>
<div class="c"><h2>📂 Analisar arquivo .pcap / .pcapng</h2><p>Analisa uma captura feita na <b>sua</b> rede (Wireshark, tcpdump no roteador, adaptador em modo monitor). Detecta deauth, ARP spoofing, DHCP falso e tráfego inseguro. Cada arquivo é analisado separadamente. Máx. 25 MB.</p><input type="file" id="pcF" accept=".pcap,.pcapng,.cap"><label style="font-size:11px"><input type="checkbox" id="pcL" style="width:auto"> limpar a captura atual antes</label><br>${btn('Analisar','pcapImport')}<pre id="opc"></pre></div>
<div class="c"><h2>Filtro</h2>${inp('flt','ex.: dns, 443, 192.168.0.1, tls, inseguro')}
<div class="tw"><table><thead><tr><th>#</th><th>Origem → Destino</th><th>Prot.</th><th>Info</th></tr></thead><tbody id="tb"></tbody></table></div></div>`,
Rede:()=>`${AVISO_NAV}
${card('alvo','Alvo','IP, faixa (192.168.0.0/24) ou domínio para as ferramentas abaixo.',inp('alvo','alvo',INFO.gateway&&INFO.gateway.includes('.')?INFO.gateway.replace(/\.\d+$/,'.0/24'):''))}
${card('nm','Nmap','Hosts, portas, versões e scripts. Varredura ativa só na sua rede (faixa privada).',btn('Hosts','run','','nm','nmap_hosts','alvo')+btn('Portas','run','','nm','nmap_rapido','alvo')+btn('Versões','run','','nm','nmap_servicos','alvo')+btn('Todas','run','','nm','nmap_todas','alvo')+btn('Scripts','run','','nm','nmap_scripts','alvo')+btn('Vulns','run','y','nm','nmap_vuln','alvo'))}
${card('dg','Caminho','Ping, traceroute (UDP, sem root) e MTR (o MTR pode exigir root).',inp('dgA','host','8.8.8.8')+btn('Ping','run','','dg','ping','dgA')+btn('Traceroute','run','','dg','traceroute','dgA')+btn('MTR','run','','dg','mtr','dgA'))}
${card('dn','DNS / WHOIS / SSL','Registros, dono, cabeçalhos e certificado.',inp('dnA','domínio','mercadolivre.com.br')+btn('DNS','run','','dn','dig','dnA')+btn('WHOIS','run','','dn','whois','dnA')+btn('Cabeçalhos','run','','dn','headers','dnA','https://')+btn('SSL','cert'))}
${card('ds','Descoberta','UPnP/SSDP e mDNS: TVs, roteadores, impressoras, IoT.',btn('UPnP','descobrir','','ssdp',4)+btn('mDNS','descobrir','','mdns',3))}
${card('pp','Portas (Python)','Teste rápido sem nmap (só faixa privada).',inp('ppA','host','')+btn('Testar','portas'))}
${card('ex','Extras','MAC→fabricante, Wake-on-LAN, sub-rede.',inp('exA','MAC ou IP/CIDR','')+btn('Fabricante','oui')+btn('Wake-on-LAN','wol')+btn('Sub-rede','subnet'))}`,
Segurança:()=>`${AVISO_NAV}
<div class="c"><h2><span class="led"></span>Inventário da rede</h2><p>Varre a faixa da <b>rede atual</b>, registra cada dispositivo e avisa quando aparece um <b>novo</b> aparelho não autorizado. Cada rede (casa, cliente) tem seu próprio inventário.</p>
${inp('invA','faixa',INFO.ip_local&&INFO.ip_local.includes('.')?INFO.ip_local:'')}${btn('🔍 Varrer agora','invScan')}${btn('Auto 5min (página aberta)','invAuto')}
<p style="margin-top:6px">Ver inventário da rede:</p>${redeSel()}${btn('Ver','invVer')}${btn('✏ Renomear rede','redeRenomear')}<div id="invT"></div></div>
<div class="c"><h2>🛡 Detecções da captura</h2><p>Analisa os pacotes ao vivo e os .pcap importados: rajada de <b>deauth/disassoc</b> (Wi-Fi), <b>ARP spoofing</b>, <b>DHCP falso</b> e tráfego inseguro. Só detecta; não ataca.</p>${btn('Atualizar','detLoad')}<div id="detT"></div></div>
<div class="c"><h2>📈 Histórico: hoje × ontem</h2><p>Compara a última varredura com a de ~24h atrás da mesma faixa, só dentro da rede escolhida acima.</p>${btn('Comparar 24h','histLoad','',24)}${btn('7 dias','histLoad','',168)}<div id="hisT"></div></div>
<div class="c"><h2>⏰ Varredura agendada</h2><p>O servidor varre sozinho (mesmo com a página fechada) e grava alertas. A agenda fica <b>presa à rede em que foi salva</b>: em outra rede (café, cliente) ela pausa e não varre nada. 0 = desligado; 5 a 1440 min.</p><div class="g"><div>${inp('agM','minutos (ex.: 30)')}</div><div>${inp('agF','faixa (vazio = automática)')}</div></div>${btn('Salvar nesta rede','agSalvar')}${btn('Status','agLoad')}<pre id="oag"></pre></div>
<div class="c"><h2>Vigilância de ARP (anti-spoofing)</h2><p>Detecta se alguém se passa pelo roteador. Sem root o Android limita a tabela ARP.</p>${btn('Verificar','arpWatch')}<pre id="oarp"></pre></div>
<div class="c"><h2>Roteador</h2><p>Auditoria do gateway e checklist de segurança.</p>${inp('rtA','gateway',INFO.gateway&&INFO.gateway.includes('.')?INFO.gateway:'')}${btn('Auditar','rtAuditar')}${btn('Abrir painel','rtPainel')}<div id="dicas" style="font-size:11px;margin-top:6px"></div><pre id="ort"></pre></div>
<div class="c"><h2>🔔 Central de alertas</h2><p>Alertas da rede atual e da captura.</p>${btn('Atualizar','loadAlertas')}${btn('Todas as redes','loadAlertas','','todas')}${btn('Limpar','alertasLimpar','r')}<div id="alertas"></div></div>`,
WiFi:()=>`${AVISO_NAV}
${card('wc','Conexão atual','SSID, sinal, velocidade. Requer Termux:API.',btn('Ler','wifiInfo'))}
<div class="c"><h2>Redes próximas</h2><p>Canais, sinal e segurança: ache o canal menos congestionado.</p>${btn('Escanear','wifiScan')}<div id="wsT"></div></div>
${card('wm','Monitor de sinal','RSSI por 60s: ache pontos fracos.',btn('Iniciar','wifiMon')+'<canvas id="wmC"></canvas>')}
${card('ce','Sinal celular','Torres e 4G/5G. Requer Termux:API.',btn('Ler','json','','ce','/api/celular'))}
${card('sp','Velocidade','Download e latência (Cloudflare).',btn('Medir','speed')+'<canvas id="spC"></canvas>')}`,
Aparelho:()=>`
${card('app','📲 App','Instale o Kit na tela inicial: abre em tela cheia, como um app. Precisa estar aberto em http://127.0.0.1 (atalho kit).',btn('Instalar app','instalar'))}
${card('in','Sistema',' ',btn('Ler','devInfo'))}
${card('bat','🔋 Bateria','Carga, temperatura e saúde (Termux:API).',btn('Ler','json','','bat','/api/bateria'))}
${card('nfc','NFC','Lê serial e conteúdo; grava texto/URL. Use só nas suas próprias tags.',btn('Ler','nfcRead')+btn('Gravar','nfcWrite'))}
${card('bt','Bluetooth LE','Inventário e bateria dos seus próprios aparelhos.',btn('Escanear','btScan'))}
${card('qr','QR / código de barras',' ',btn('Ler','qr')+'<video id="qrV" playsinline style="width:100%;display:none"></video>')}
${card('gps','GPS',' ',btn('Localizar','gps'))}
${card('iss','🛰 Satélites / ISS','Posição da Estação Espacial e distância de você.',btn('Rastrear','iss'))}
${card('sen','Sensores','Acelerômetro, giroscópio, bússola.',btn('Iniciar','sensors'))}
${card('cpu','Estresse de CPU','Detecta queda por aquecimento.',btn('10s','cpu'))}`,
Testes:()=>`
${card('tl','Tela','Pixel morto. Toque para trocar a cor.',btn('Iniciar','tela'))}
${card('tc','Touch','Pinte tudo; sobras = zona morta.',btn('Iniciar','touch'))}
${card('sm','Alto-falante',' ',btn('Varredura','sweep')+btn('Esq.','tone','',1000,-1)+btn('Dir.','tone','',1000,1))}
${card('mc','Microfone',' ',btn('15s','mic')+'<canvas id="mcC"></canvas>')}
${card('cm','Câmeras / lanterna',' ',btn('Listar','media')+btn('Lanterna','torch'))}
${card('mo','📡 Sinalização Morse','Pisca a lanterna (ou a tela, se a lanterna não estiver acessível) em código Morse.',inp('moT','texto','SOS')+btn('Transmitir','morse')+btn('Parar','moParar','r'))}
${card('vb','Vibração',' ',btn('Testar','vibrar'))}`,
Relatório:()=>`${AVISO_NAV}
<div class="c"><h2>Relatório técnico</h2><p>Consolida a rede escolhida: inventário, alertas, histórico, detecções e captura. PDF pela impressão; JSON e .pcap completos para arquivar ou abrir no Wireshark.</p>
${redeSel()}${btn('✏ Renomear rede','redeRenomear')}<br>
${btn('📄 Gerar','relatorio')}${btn('🖨 Imprimir / PDF','imprimir')}${btn('⬇ JSON','baixarJSON')}${btn('⬇ .pcap','baixarPcap')}</div>
<div id="rel" class="c" style="background:#fff;color:#111"></div>`};
let aba='Painel';
function draw(){$('#nav').innerHTML=Object.keys(ABAS).map(k=>btn(esc(k),'aba',k==aba?'on':'',k)).join('');$('#main').innerHTML=ABAS[aba]();redesFill();if(aba=='Captura'){$('#flt').oninput=capDraw;capDraw()}if(aba=='Segurança'&&SERVIDOR){loadAlertas();detLoad();agLoad();invVer()}if(aba=='Painel')painel(true)}
window.onerror=m=>{$('#st').textContent='erro: '+m};window.onunhandledrejection=e=>{$('#st').textContent='erro: '+(e.reason?.message||e.reason)};

// ---------- Ações dos botões (um único ouvinte; nada de JS inline no HTML)
const ACOES={
  aba:k=>{aba=k;draw();scrollTo(0,0)},
  ir:(a,f)=>{aba=a;draw();if(f)ACOES[f]()},
  run:(id,tool,campo,pre='')=>stream(id,tool,pre+v(campo)),

async function iss(){out('iss','Consultando órbita…');let r;try{r=await(await fetch('https://api.wheretheiss.at/v1/satellites/25544')).json()}catch(e){return out('iss','Sem acesso à internet: '+e.message)}let dist='';if(POS){const R=6371,dLat=(r.latitude-POS.latitude)*Math.PI/180,dLon=(r.longitude-POS.longitude)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(POS.latitude*Math.PI/180)*Math.cos(r.latitude*Math.PI/180)*Math.sin(dLon/2)**2;dist=Math.round(2*R*Math.asin(Math.sqrt(x)))+' km de você (no solo)'}else dist='Rode o GPS antes para calcular a distância';out('iss',{estacao:'ISS (25544)',lat:r.latitude.toFixed(3),lon:r.longitude.toFixed(3),altitude_km:Math.round(r.altitude),velocidade_kmh:Math.round(r.velocity),visivel:r.visibility,distancia:dist})}

const CORES=[['preto',0],['marrom',1],['vermelho',2],['laranja',3],['amarelo',4],['verde',5],['azul',6],['violeta',7],['cinza',8],['branco',9],['dourado',-1],['prata',-2]];
const TOL=[['dourado ±5%',5],['prata ±10%',10],['marrom ±1%',1],['vermelho ±2%',2],['nenhuma ±20%',20]];
const num=id=>{const x=parseFloat(v(id).replace(',','.'));return isNaN(x)?null:x};
const fmtU=(x,u)=>{const a=Math.abs(x);return a>=1e6?(x/1e6).toPrecision(4)+' M'+u:a>=1e3?(x/1e3).toPrecision(4)+' k'+u:a<1e-3&&a>0?(x*1e6).toPrecision(4)+' µ'+u:a<1&&a>0?(x*1e3).toPrecision(4)+' m'+u:x.toPrecision(4)+' '+u};
function ohm(){const V=num('ohV'),I=num('ohI'),R=num('ohR');let t;if(V!=null&&I!=null)t=`R = ${fmtU(V/I,'Ω')}`;else if(V!=null&&R!=null)t=`I = ${fmtU(V/R,'A')}`;else if(I!=null&&R!=null)t=`V = ${fmtU(I*R,'V')}`;else return out('oh','Preencha dois campos.');const P=V!=null&&I!=null?V*I:V!=null&&R!=null?V*V/R:I*I*R;out('oh',t+`\nPotência = ${fmtU(P,'W')}`)}
function resistor(){const[a,b,m]=[1,2,3].map(i=>CORES[+v('rc'+i)][1]),t=TOL[+v('rc4')][1];if(a<0||b<0)return out('rc','As duas primeiras faixas não podem ser dourado/prata.');const R=(a*10+b)*Math.pow(10,m);out('rc',`${fmtU(R,'Ω')} ±${t}% (de ${fmtU(R*(1-t/100),'Ω')} a ${fmtU(R*(1+t/100),'Ω')})`)}
function divisor(){const i=num('dvI'),a=num('dv1'),b=num('dv2');if([i,a,b].includes(null))return out('dv','Preencha Vin, R1 e R2.');out('dv',`Vout = ${fmtU(i*b/(a+b),'V')} · corrente = ${fmtU(i/(a+b),'A')}`)}
function ledR(){const f=num('ldF'),l=num('ldV'),m=num('ldA');if([f,l,m].includes(null)||f<=l)return out('dv','Vfonte precisa ser maior que Vled.');const R=(f-l)/(m/1000),pad=[10,12,15,18,22,27,33,39,47,56,68,82];let e=Math.pow(10,Math.floor(Math.log10(R)));const c=pad.map(p=>p*e/10).concat(pad.map(p=>p*e)).find(x=>x>=R);out('dv',`R = ${fmtU(R,'Ω')} → use ${fmtU(c,'Ω')} (valor comercial acima) · potência ${fmtU((f-l)*m/1000,'W')}`)}
function conv(){const s=v('cvA');if(!s)return;let n=/^0x[0-9a-f]+$/i.test(s)?parseInt(s,16):/^0b[01]+$/i.test(s)?parseInt(s.slice(2),2):/^\d+$/.test(s)?parseInt(s,10):null;if(n==null){const b=new TextEncoder().encode(s);return out('cv',`Texto → hex: ${[...b].map(x=>x.toString(16).padStart(2,'0')).join(' ')}\nbin: ${[...b].map(x=>x.toString(2).padStart(8,'0')).join(' ')}`)}out('cv',`dec ${n}\nhex 0x${n.toString(16).toUpperCase()}\nbin ${n.toString(2)}\noct ${n.toString(8)}${n>=32&&n<127?'\nASCII '+String.fromCharCode(n):''}`)}
function kwh(){const w=num('kwW'),h=num('kwH'),p=num('kwP');if([w,h,p].includes(null))return out('kw','Preencha os três.');const m=w*h*30/1000;out('kw',`${m.toFixed(1)} kWh por mês ≈ R$ ${(m*p).toFixed(2)}`)}
let GS=[];function gsParar(){GS.forEach(n=>{try{n.stop()}catch{}});GS=[]}
function osc(f,tipo,dur,ini=0){ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=tipo;o.frequency.value=f;g.gain.value=.2;o.connect(g).connect(ac.destination);o.start(ac.currentTime+ini);o.stop(ac.currentTime+ini+dur);GS.push(o);return o}
function gerar(){gsParar();const f=Math.min(22000,Math.max(10,num('gsF')||1000)),d=Math.min(60,Math.max(.1,num('gsD')||2));osc(f,v('gsT')||'sine',d);out('gs',`${f} Hz ${v('gsT')} por ${d} s`)}
function varre(){gsParar();const o=osc(20,'sine',15);o.frequency.setValueAtTime(20,ac.currentTime);o.frequency.exponentialRampToValueAtTime(20000,ac.currentTime+15);out('gs','20 Hz → 20 kHz em 15 s. Anote quando deixa de ouvir (adultos: ~15–17 kHz).')}
function ruido(){gsParar();ac=ac||new AudioContext();const b=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2;const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start();GS.push(s);out('gs','Ruído branco por 3 s')}
const DTMF={1:[697,1209],2:[697,1336],3:[697,1477],A:[697,1633],4:[770,1209],5:[770,1336],6:[770,1477],B:[770,1633],7:[852,1209],8:[852,1336],9:[852,1477],C:[852,1633],'*':[941,1209],0:[941,1336],'#':[941,1477],D:[941,1633]};
function dtmf(k){DTMF[k].forEach(f=>osc(f,'sine',.25));out('gs',`DTMF ${k}: ${DTMF[k].join(' + ')} Hz`)}

let NV=0;function nivel(){if(NV)return;NV=1;addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity||{};if(a.x==null)return;const ax=Math.atan2(a.x,a.z)*57.3,ay=Math.atan2(a.y,a.z)*57.3;out('nv',`X ${ax.toFixed(1)}° · Y ${ay.toFixed(1)}° ${Math.abs(ax)<1&&Math.abs(ay)<1?'✔ NIVELADO':''}`)})}

let IRI=null;
async function irInfo(){out('ir','…');const r=await apiGET('/api/ir/info');if(r.erro)return out('ir',r.erro);IRI=r;const s=$('#idM');if(s)s.innerHTML='<option value="">marca…</option>'+Object.entries(r.marcas).map(([m,n])=>`<option>${esc(m)}</option>`).join('');if(!r.tem_ir&&$('#irModo'))$('#irModo').value='fone';out('ir',r.tem_ir?`✔ Este celular tem emissor IR. Faixas: ${JSON.stringify(r.faixas)}`:'✖ '+r.motivo)}
function irFone(freq,p){ac=ac||new AudioContext();const sr=ac.sampleRate,port=freq/2,tot=p.reduce((a,b)=>a+b,0),b=ac.createBuffer(2,Math.ceil(sr*(tot/1e6+.05)),sr),L=b.getChannelData(0),R=b.getChannelData(1);let t=0;p.forEach((d,i)=>{const n0=Math.floor(t*sr/1e6),n1=Math.floor((t+d)*sr/1e6);if(i%2==0)for(let n=n0;n<n1;n++){const s=Math.sin(2*Math.PI*port*n/sr);L[n]=s;R[n]=-s}t+=d});const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start()}
async function irMandar(cod){if(!$('#irOk')?.checked&&!cod.salvo)throw new Error('marque "Este aparelho é meu"');if(($('#irModo')?.value||'celular')=='fone'){irFone(cod.frequencia,cod.padrao);return{ok:true}}const r=await apiPOST('/api/ir/enviar',{protocolo:cod.protocolo,endereco:cod.endereco,comando:cod.comando,pronto:cod.pronto,proprio:true});if(r.erro)throw new Error(r.erro);return r}
const irCodigo=(m,i,tecla)=>apiGET(`/api/ir/codigo?marca=${encodeURIComponent(m)}&i=${i}`+(tecla?'&tecla='+encodeURIComponent(tecla):''));
let DESC=null;
async function irDesc(){if(!IRI)await irInfo();const m=v('idM');if(!m)return out('id','Escolha a marca.');if(!$('#irOk').checked)return out('id','Marque "Este aparelho é meu" para continuar.');DESC={m,i:0};return irPasso()}
async function irPasso(){const c=await irCodigo(DESC.m,DESC.i);if(c.erro){DESC=null;return out('id',c.erro)}await irMandar(c);DESC.total=c.total;html('id',`Enviei o código ${DESC.i+1} de ${c.total} (${esc(c.protocolo)} ${esc(c.endereco)}/${esc(c.comando)}).`);$('#idP').innerHTML=`<p><b>A TV respondeu (ligou/desligou)?</b></p>${btn('✔ Sim, salvar','irSim')}${btn('✖ Não, próximo','irNao','y')}${btn('Repetir','irPasso')}${btn('Parar','irParar','r')}`}
function irNao(){if(!DESC)return;if(++DESC.i>=DESC.total){$('#idP').innerHTML='';DESC=null;return out('id','Acabaram os códigos desta marca. Tente outra marca próxima ou use o Código manual/TV pela rede.')}return irPasso()}
function irSim(){const nome=prompt('Nome para este aparelho (ex.: TV da sala):',DESC.m);if(!nome)return;const l=LS.get('kit_ir',[]);l.push({nome:nome.slice(0,40),marca:DESC.m,i:DESC.i});LS.set('kit_ir',l);$('#idP').innerHTML='';out('id','Salvo em Meus aparelhos.');DESC=null;irLista()}
function irParar(){DESC=null;$('#idP').innerHTML='';out('id','Parado.')}
function irLista(){const e=$('#iaL');if(!e)return;const l=LS.get('kit_ir',[]);e.innerHTML=l.length?l.map((x,j)=>`<p><b>${esc(x.nome)}</b> (${esc(x.marca)}) ${btn('⏻','irApar','',j)}${((IRI&&IRI.teclas[x.marca])||[]).map(t=>btn(esc(t),'irApar','',j,t)).join('')}${btn('🗑','irDel','r',j)}</p>`).join(''):'<p>Nenhum aparelho salvo. Use "Descobrir o código".</p>'}
async function irApar(j,tecla){const x=LS.get('kit_ir',[])[j];if(!x)return;const c=await irCodigo(x.marca,x.i,tecla);if(c.erro)return out('ia',c.erro);await irMandar({...c,salvo:true});out('ia',`${x.nome}: ${tecla||'liga/desliga'} enviado.`)}
function irDel(j){const l=LS.get('kit_ir',[]);if(!confirm('Remover '+(l[j]||{}).nome+'?'))return;l.splice(j,1);LS.set('kit_ir',l);irLista()}
async function irTodos(){const l=LS.get('kit_ir',[]);if(!l.length)return out('ia','Nenhum aparelho salvo.');for(let j=0;j<l.length;j++){await irApar(j);await sleep(1500)}out('ia',`Enviado para ${l.length} aparelho(s) seu(s).`)}
async function irManual(){const px=v('imX');let c;if(px){c=await apiGET('/api/ir/padrao?pronto='+encodeURIComponent(px));c.pronto=px}else{c=await apiGET(`/api/ir/padrao?protocolo=${v('imP')}&endereco=${encodeURIComponent(v('imE'))}&comando=${encodeURIComponent(v('imC'))}`);Object.assign(c,{protocolo:v('imP'),endereco:v('imE'),comando:v('imC')})}if(c.erro)return out('im',c.erro);await irMandar(c);out('im',`Enviado: ${c.frequencia} Hz, ${c.padrao.length} pulsos.`)}
